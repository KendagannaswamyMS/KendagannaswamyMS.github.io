name: Update GitHub contributions snapshot

# Saves the contribution calendar to contributions.json once a day.
# The site reads this file first, then a public contributions API, then a copy built into the page.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contributions.yml", ".github/scripts/contributions.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar from the public profile
        run: python3 .github/scripts/contributions.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          git diff --cached --quiet || { git commit -m "Update contributions snapshot"; git push; }
