name: Update GitHub contributions snapshot

# Saves the contribution calendar to contributions.json once a day.
# The site loads live data first and falls back to this file.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contributions.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query { user(login: "KendagannaswamyMS") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount contributionLevel } } } } } }' \
            --jq '.data.user.contributionsCollection.contributionCalendar
              | {total: .totalContributions,
                 days: [.weeks[].contributionDays[]
                   | {d: .date, c: .contributionCount,
                      l: ({"NONE":0,"FIRST_QUARTILE":1,"SECOND_QUARTILE":2,"THIRD_QUARTILE":3,"FOURTH_QUARTILE":4}[.contributionLevel])}]}' \
            > contributions.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          git diff --cached --quiet || { git commit -m "Update contributions snapshot"; git push; }
